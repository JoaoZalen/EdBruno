<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 360" width="100%" height="100%" style="background-color: #ffffff; font-family: Arial, sans-serif;">
  <defs>
    <filter id="shadow2" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="2" dy="3" stdDeviation="3" flood-color="#000000" flood-opacity="0.1"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#475569" />
    </marker>
    <marker id="arrow-green2" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#16a34a" />
    </marker>
    <marker id="arrow-red2" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#dc2626" />
    </marker>
  </defs>

  <text x="425" y="35" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">Fluxo das Operações: Enqueue e Dequeue</text>

  <!-- CAIXA PRINCIPAL DA FILA -->
  <rect x="230" y="110" width="390" height="150" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6,6"/>
  <text x="425" y="135" text-anchor="middle" font-size="14" font-weight="bold" fill="#475569">ESTADO DA FILA EM MEMÓRIA</text>

  <!-- ELEMENTOS DENTRO DA FILA -->
  <!-- NÓ 1 -->
  <g transform="translate(260, 160)" filter="url(#shadow2)">
    <rect x="0" y="0" width="90" height="60" rx="6" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
    <text x="45" y="36" text-anchor="middle" font-size="16" font-weight="bold" fill="#0369a1">Nó 1</text>
  </g>
  <path d="M 350 190 L 380 190" stroke="#0284c7" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- NÓ 2 -->
  <g transform="translate(385, 160)" filter="url(#shadow2)">
    <rect x="0" y="0" width="90" height="60" rx="6" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
    <text x="45" y="36" text-anchor="middle" font-size="16" font-weight="bold" fill="#0369a1">Nó 2</text>
  </g>
  <path d="M 475 190 L 505 190" stroke="#0284c7" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- NÓ 3 -->
  <g transform="translate(510, 160)" filter="url(#shadow2)">
    <rect x="0" y="0" width="90" height="60" rx="6" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
    <text x="45" y="36" text-anchor="middle" font-size="16" font-weight="bold" fill="#0369a1">Nó 3</text>
  </g>

  <!-- OPERAÇÃO DEQUEUE (SAÍDA NO INÍCIO) -->
  <g transform="translate(40, 160)" filter="url(#shadow2)">
    <rect x="0" y="0" width="110" height="60" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
    <text x="55" y="28" text-anchor="middle" font-size="13" font-weight="bold" fill="#b91c1c">DEQUEUE()</text>
    <text x="55" y="46" text-anchor="middle" font-size="11" fill="#991b1b">Remove do Início</text>
  </g>
  <path d="M 260 190 L 160 190" stroke="#dc2626" stroke-width="3" fill="none" marker-end="url(#arrow-red2)"/>

  <!-- OPERAÇÃO ENQUEUE (ENTRADA NO FIM) -->
  <g transform="translate(700, 160)" filter="url(#shadow2)">
    <rect x="0" y="0" width="110" height="60" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <text x="55" y="28" text-anchor="middle" font-size="13" font-weight="bold" fill="#15803d">ENQUEUE()</text>
    <text x="55" y="46" text-anchor="middle" font-size="11" fill="#166534">Insere no Fim</text>
  </g>
  <path d="M 700 190 L 610 190" stroke="#16a34a" stroke-width="3" fill="none" marker-end="url(#arrow-green2)"/>

  <!-- INDICADORES DE DIREÇÃO DO FLUXO -->
  <text x="425" y="295" text-anchor="middle" font-size="13" font-weight="bold" fill="#334155">Direção do Fluxo de Dados: Início (Front) &lt;------------------ Fim (Rear)</text>
  <text x="425" y="325" text-anchor="middle" font-size="12" fill="#64748b">Primeiro elemento a entrar é sempre o primeiro a ser removido (Princípio FIFO)</text>
</svg>
